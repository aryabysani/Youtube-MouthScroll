<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MouthScroll</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <header>
    <!-- dot-matrix mouth, same mark as the icon -->
    <svg class="logo" viewBox="0 0 11 11" aria-hidden="true">
      <g class="lip">
        <circle cx="1.5" cy="3.5" r="0.44" /><circle cx="2.5" cy="3.5" r="0.44" />
        <circle cx="3.5" cy="3.5" r="0.44" /><circle cx="4.5" cy="3.5" r="0.44" />
        <circle cx="5.5" cy="3.5" r="0.44" /><circle cx="6.5" cy="3.5" r="0.44" />
        <circle cx="7.5" cy="3.5" r="0.44" /><circle cx="8.5" cy="3.5" r="0.44" />
        <circle cx="9.5" cy="3.5" r="0.44" />
        <circle cx="0.5" cy="4.5" r="0.44" /><circle cx="1.5" cy="4.5" r="0.44" />
        <circle cx="9.5" cy="4.5" r="0.44" /><circle cx="10.5" cy="4.5" r="0.44" />
        <circle cx="0.5" cy="5.5" r="0.44" /><circle cx="1.5" cy="5.5" r="0.44" />
        <circle cx="9.5" cy="5.5" r="0.44" /><circle cx="10.5" cy="5.5" r="0.44" />
        <circle cx="1.5" cy="6.5" r="0.44" /><circle cx="2.5" cy="6.5" r="0.44" />
        <circle cx="8.5" cy="6.5" r="0.44" /><circle cx="9.5" cy="6.5" r="0.44" />
        <circle cx="2.5" cy="7.5" r="0.44" /><circle cx="3.5" cy="7.5" r="0.44" />
        <circle cx="4.5" cy="7.5" r="0.44" /><circle cx="5.5" cy="7.5" r="0.44" />
        <circle cx="6.5" cy="7.5" r="0.44" /><circle cx="7.5" cy="7.5" r="0.44" />
        <circle cx="8.5" cy="7.5" r="0.44" />
      </g>
      <g class="open">
        <circle cx="2.5" cy="4.5" r="0.44" /><circle cx="3.5" cy="4.5" r="0.44" />
        <circle cx="4.5" cy="4.5" r="0.44" /><circle cx="5.5" cy="4.5" r="0.44" />
        <circle cx="6.5" cy="4.5" r="0.44" /><circle cx="7.5" cy="4.5" r="0.44" />
        <circle cx="8.5" cy="4.5" r="0.44" />
        <circle cx="2.5" cy="5.5" r="0.44" /><circle cx="3.5" cy="5.5" r="0.44" />
        <circle cx="4.5" cy="5.5" r="0.44" /><circle cx="5.5" cy="5.5" r="0.44" />
        <circle cx="6.5" cy="5.5" r="0.44" /><circle cx="7.5" cy="5.5" r="0.44" />
        <circle cx="8.5" cy="5.5" r="0.44" />
        <circle cx="3.5" cy="6.5" r="0.44" /><circle cx="4.5" cy="6.5" r="0.44" />
        <circle cx="5.5" cy="6.5" r="0.44" /><circle cx="6.5" cy="6.5" r="0.44" />
        <circle cx="7.5" cy="6.5" r="0.44" />
      </g>
    </svg>

    <div class="title-wrap">
      <h1>MouthScroll</h1>
      <p class="subtitle">Hands-free Shorts &amp; Reels</p>
    </div>

    <!-- Master ON/OFF toggle -->
    <label class="toggle" title="Enable / Disable MouthScroll">
      <input type="checkbox" id="chk-enabled" />
      <span class="track"><span class="thumb"></span></span>
    </label>
  </header>

  <section id="controls">

    <!-- Sensitivity slider -->
    <div class="row">
      <label for="slider-sensitivity">
        Sensitivity
        <span class="hint" id="hint-sensitivity">–</span>
      </label>
      <div class="slider-wrap">
        <span class="slider-label">Low</span>
        <input type="range" id="slider-sensitivity"
               min="0.15" max="0.60" step="0.01" />
        <span class="slider-label">High</span>
      </div>
    </div>

    <!-- Eyebrow sensitivity slider -->
    <div class="row">
      <label for="slider-brow">
        Brow sensitivity
        <span class="hint" id="hint-brow">–</span>
      </label>
      <div class="slider-wrap">
        <span class="slider-label">Low</span>
        <input type="range" id="slider-brow"
               min="0.15" max="0.45" step="0.01" />
        <span class="slider-label">High</span>
      </div>
    </div>

    <!-- Cooldown slider -->
    <div class="row">
      <label for="slider-cooldown">
        Cooldown
        <span class="hint" id="hint-cooldown">–</span>
      </label>
      <div class="slider-wrap">
        <span class="slider-label">Fast</span>
        <input type="range" id="slider-cooldown"
               min="500" max="3000" step="100" />
        <span class="slider-label">Slow</span>
      </div>
    </div>

    <!-- Camera preview toggle -->
    <div class="row row-inline">
      <label for="chk-preview">Show camera preview</label>
      <label class="toggle small">
        <input type="checkbox" id="chk-preview" />
        <span class="track"><span class="thumb"></span></span>
      </label>
    </div>

  </section>

  <footer>

    <!-- Gestures do different things per surface — spell both out -->
    <div class="mode">
      <p class="mode-name">Shorts &amp; Reels</p>
      <div class="legend">
        <span class="key">Mouth</span><span class="arrow">&rarr;</span><span class="act">Next video</span>
      </div>
      <div class="legend">
        <span class="key">Brows</span><span class="arrow">&rarr;</span><span class="act">Previous video</span>
      </div>
    </div>

    <div class="mode">
      <p class="mode-name">Long YouTube videos</p>
      <div class="legend">
        <span class="key">Mouth</span><span class="arrow">&rarr;</span><span class="act">Play / pause</span>
      </div>
      <div class="legend">
        <span class="key">Brows</span><span class="arrow">&rarr;</span><span class="act">Hold to skip +5<span class="unit">s</span></span>
      </div>
    </div>

    <p class="note dim"><span class="live"></span>All processing is 100% local &amp; private</p>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
